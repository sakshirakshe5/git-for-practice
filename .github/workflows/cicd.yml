name: CICD 

on: workflow_dispatch

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        run: echo "cloning the code"
  build:
     runs-on: ubuntu-latest
     steps:
        - name: build the code
          run: echo "building the code"

  test:
      runs-on: ubuntu-latest
      steps:
        - name: test the code
          run: echo "testing the code"
 
  deploy :
      runs-on: ubuntu-latest
      steps:
        - name: deploy the code
          run: echo "deploying the code"

  
        
